name: Core tests

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Syntax validation
        run: |
          node --check js/app.js
          node --check js/state.js
          node --check js/db.js
          node --check sw.js
          find js -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Run automated tests
        run: npm test
